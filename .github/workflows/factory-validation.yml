name: Factory Validation Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  validate-factory:
    name: Validate Dark Factory Contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Validate Cube scaffold
        run: npm run validate:cube

      - name: Run Intrepid Cube smoke test
        run: npm run smoke:cube:intrepid

      - name: Run factory validation
        run: npm run test:factory
