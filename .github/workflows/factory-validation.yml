name: Factory Validation Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  validate-factory:
    name: Validate Dark Factory Contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Validate Cube scaffold
        run: npm run validate:cube

      - name: Verify gateway access boundary
        run: npm run verify:gateway:access

      - name: Verify gateway ledger model
        run: npm run verify:gateway:ledger-model

      - name: Verify gateway attribution
        run: npm run verify:gateway:attribution

      - name: Verify gateway ledger reconciliation
        run: npm run verify:gateway:ledger-reconciliation

      - name: Verify trace contract
        run: npm run verify:trace:contract

      - name: Verify trace reconciliation
        run: npm run verify:trace:reconciliation

      - name: Verify retrieval policy
        run: npm run verify:retrieval-policy

      - name: Verify trace viewer
        run: npm run verify:trace:viewer

      - name: Verify eval harness
        run: npm run verify:eval:harness

      - name: Verify Intrepid Cube adapter contract
        run: npm run verify:intrepid:cube-adapter

      - name: Verify Intrepid sandbox mapping contract
        run: npm run verify:intrepid:sandbox-mapping

      - name: Run Intrepid Cube smoke test
        run: npm run smoke:cube:intrepid

      - name: Run factory validation
        run: npm run test:factory
